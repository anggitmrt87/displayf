name: Build libdisplayfeature

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CMAKE_VERSION: '3.22.x'
  NDK_VERSION: 'r26b'

jobs:
  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
        api: [26]

    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DDF_BUILD_SHARED=ON \
            -DDF_BUILD_STATIC=ON \
            -DDF_BUILD_JNI=ON \
            -DDF_BUILD_EXAMPLES=ON \
            -DDF_BUILD_CLI=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install staging
        run: |
          cmake --install build --prefix stage
          find stage -type f -exec ls -la {} \;

      - name: Package
        run: |
          PKG=libdisplayfeature-${{ matrix.abi }}-api${{ matrix.api }}
          mkdir -p dist/$PKG
          cp -r stage/* dist/$PKG/
          cd dist && tar czf $PKG.tar.gz $PKG

      - uses: actions/upload-artifact@v4
        with:
          name: libdisplayfeature-${{ matrix.abi }}-api${{ matrix.api }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-host:
    name: Host (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure
        run: |
          cmake -S . -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DDF_BUILD_SHARED=ON \
            -DDF_BUILD_STATIC=ON \
            -DDF_BUILD_EXAMPLES=ON \
            -DDF_BUILD_CLI=ON \
            -DDF_DISABLE_ANDROID_LOG=ON

      - name: Build
        run: cmake --build build-host -j

      - name: Install staging
        run: cmake --install build-host --prefix stage-host

      - name: Package
        run: |
          PKG=libdisplayfeature-host-x86_64
          mkdir -p dist/$PKG
          cp -r stage-host/* dist/$PKG/
          cd dist && tar czf $PKG.tar.gz $PKG

      - uses: actions/upload-artifact@v4
        with:
          name: libdisplayfeature-host-x86_64
          path: dist/*.tar.gz

  release:
    name: Release
    needs: [build-android, build-host]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package all
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
