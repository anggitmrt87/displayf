name: Build libdisplayfeature

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CMAKE_VERSION: '3.22.x'
  # Ganti sesuai NDK yang tersedia:
  #   r28c  → terbaru stabil (per ~2025)
  #   r28b  → sama, patch minor
  #   r27c  → LTS-ish, paling banyak dipakai
  #   r30   → jika sudah rilis, tinggal ganti
  NDK_VERSION: 'r28c'
  ANDROID_API: '30'

jobs:
  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Force ANDROID_NDK_HOME
        run: |
          NDK_PATH="${{ steps.ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK path: $NDK_PATH"
          ls "$NDK_PATH" | head

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Verify toolchain
        run: |
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$CC" --version | head -3
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DDF_BUILD_SHARED=ON \
            -DDF_BUILD_STATIC=ON \
            -DDF_BUILD_JNI=ON \
            -DDF_BUILD_EXAMPLES=ON \
            -DDF_BUILD_CLI=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Verify artifacts
        run: |
          echo "=== Libraries ==="
          ls -la build/libdisplayfeature* 2>/dev/null || true
          echo "=== Binaries ==="
          ls -la build/dfc-cli build/c-demo 2>/dev/null || true
          echo "=== File types ==="
          file build/libdisplayfeature.so 2>/dev/null || true
          file build/libdisplayfeature.a  2>/dev/null || true
          file build/dfc-cli 2>/dev/null || true
          echo "=== Symbols (sanity: harus ada df_client_create) ==="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D build/libdisplayfeature.so 2>/dev/null | grep -E "df_client_create|df_set_reading" || true

      - name: Install staging
        run: |
          cmake --install build --prefix stage
          find stage -type f -exec ls -la {} \;

      - name: Package
        run: |
          PKG=libdisplayfeature-${{ matrix.abi }}-api${{ env.ANDROID_API }}
          mkdir -p dist/$PKG
          cp -r stage/* dist/$PKG/
          cd dist && tar czf $PKG.tar.gz $PKG

      - uses: actions/upload-artifact@v4
        with:
          name: libdisplayfeature-${{ matrix.abi }}-api${{ env.ANDROID_API }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-host:
    name: Host (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure
        run: |
          cmake -S . -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DDF_BUILD_SHARED=ON \
            -DDF_BUILD_STATIC=ON \
            -DDF_BUILD_EXAMPLES=ON \
            -DDF_BUILD_CLI=ON \
            -DDF_DISABLE_ANDROID_LOG=ON

      - name: Build
        run: cmake --build build-host -j

      - name: Install staging
        run: cmake --install build-host --prefix stage-host

      - name: Package
        run: |
          PKG=libdisplayfeature-host-x86_64
          mkdir -p dist/$PKG
          cp -r stage-host/* dist/$PKG/
          cd dist && tar czf $PKG.tar.gz $PKG

      - uses: actions/upload-artifact@v4
        with:
          name: libdisplayfeature-host-x86_64
          path: dist/*.tar.gz

  release:
    name: Release
    needs: [build-android, build-host]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package all
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
