name: Build DisplayFeature Hook

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NDK_VERSION: 'r28c'
  ANDROID_API: '30'
  CMAKE_VERSION: '3.22.x'

jobs:
  build-hook:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Force NDK env
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK: ${{ steps.ndk.outputs.ndk-path }}"

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Show toolchain
        run: |
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -2

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Verify
        run: |
          echo "=== Files ==="
          ls -la build/displayfeature.default.so || true
          ls -la build/dump_symbols || true
          echo "=== Type ==="
          file build/displayfeature.default.so || true
          echo "=== Exported symbols ==="
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D build/displayfeature.default.so 2>/dev/null | \
            grep -E " (HMI|hooked_open|HAL_MODULE_INFO_SYM)" || echo "(no symbols yet)"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/displayfeature.default.so \
             dist/displayfeature.default-${{ matrix.abi }}.so
          [ -f build/dump_symbols ] && \
            cp build/dump_symbols dist/dump_symbols-${{ matrix.abi }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: hook-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error

  package-magisk:
    name: Package Magisk module
    needs: build-hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hook-arm64-v8a
          path: artifacts/arm64

      - uses: actions/download-artifact@v4
        with:
          name: hook-armeabi-v7a
          path: artifacts/arm32
        continue-on-error: true

      - name: Build Magisk zip
        run: |
          chmod +x scripts/package_magisk.sh
          ./scripts/package_magisk.sh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: DisplayFeatureHook-Magisk
          path: DisplayFeatureHook.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [build-hook, package-magisk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name '*.so' -exec cp {} release/ \;
          find artifacts -name '*.zip' -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
